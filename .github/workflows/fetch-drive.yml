name: Fetch Drive zip

on:
  push:
    branches:
      - arena/01a10676-aneeq814-github-io
    paths:
      - '.github/workflows/fetch-drive.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a10676-aneeq814-github-io

      - name: Download zip from Google Drive
        run: |
          mkdir -p _import
          pip install --quiet gdown || true
          gdown "1BOZFvHEk8-GaJNBctcr_zwHy1ctpOjNz" -O _import/portfolio.zip \
            || curl -sSL -o _import/portfolio.zip "https://drive.usercontent.google.com/download?id=1BOZFvHEk8-GaJNBctcr_zwHy1ctpOjNz&export=download&confirm=t" \
            || curl -sSL -o _import/portfolio.zip "https://drive.google.com/uc?export=download&id=1BOZFvHEk8-GaJNBctcr_zwHy1ctpOjNz"
          ls -la _import
          file _import/portfolio.zip
          echo "--- zip listing ---"
          unzip -l _import/portfolio.zip | head -200

      - name: Extract
        run: |
          mkdir -p _import/unzipped
          unzip -o _import/portfolio.zip -d _import/unzipped > /dev/null
          echo "--- extracted tree ---"
          find _import/unzipped | head -400

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A _import
          git commit -m "chore: import portfolio zip from Google Drive"
          git push origin HEAD:arena/01a10676-aneeq814-github-io
